<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f8f7">
<meta name="robots" content="noindex, nofollow">
<title>Temporarily unavailable | Noida Bus Tracker</title>
<style>
:root{color-scheme:light;--ink:#132a27;--muted:#63736f;--teal:#087f72;--line:#dfe9e5;--paper:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#d9f2e9 0,transparent 48%),#f5f8f7;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,560px);text-align:center;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:28px;padding:clamp(28px,6vw,54px);box-shadow:0 24px 80px #173b2c0d}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.03em;margin-bottom:38px}.mark{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:var(--teal);color:#fff;font-size:21px}
.visual{width:112px;height:112px;margin:0 auto 26px;display:grid;place-items:center;border-radius:32px;background:#e7f6f0;border:1px solid #d3eee4;color:var(--teal)}
h1{font-size:clamp(30px,6vw,42px);line-height:1.1;letter-spacing:-.045em;margin:0 0 16px}p{font-size:16px;line-height:1.75;color:var(--muted);margin:0 auto;max-width:420px}
.status{display:inline-flex;align-items:center;gap:8px;margin:26px 0 0;padding:9px 13px;border:1px solid var(--line);border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#52645f}.dot{width:7px;height:7px;background:#d19a39;border-radius:50%;box-shadow:0 0 0 4px #d19a391c}
footer{margin-top:34px;padding-top:22px;border-top:1px solid var(--line);font-size:12px;color:#84918d}
@media(max-width:420px){body{padding:14px}main{border-radius:22px}.brand{margin-bottom:30px}}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark">N</span><span>Noida Bus Tracker</span></div>
  <div class="visual" aria-hidden="true"><svg width="60" height="60" viewBox="0 0 60 60" fill="none"><path d="M30 7v5M30 48v5M7 30h5M48 30h5M13.7 13.7l3.6 3.6m25.4 25.4 3.6 3.6m0-32.6-3.6 3.6M17.3 42.7l-3.6 3.6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="30" cy="30" r="16" stroke="currentColor" stroke-width="2.5"/><path d="M30 20v11l7 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h1>We’ll be back soon.</h1>
  <p id="message">We are making a few improvements. Please check back shortly.</p>
  <div class="status"><span class="dot"></span> Temporary service pause</div>
  <footer>Thank you for your patience.<br>Noida · Greater Noida</footer>
</main>
<script>
fetch("https://noida-bus-tracker.onrender.com/api/maintenance",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(s=>{if(s&&s.message)document.getElementById("message").textContent=s.message}).catch(()=>{});
</script>
</body>
</html>
