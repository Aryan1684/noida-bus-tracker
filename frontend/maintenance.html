<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f8f7">
<meta name="robots" content="noindex, nofollow">
<title>Temporarily unavailable | Noida Bus Tracker</title>
<style>
:root{color-scheme:light;--ink:#132a27;--muted:#63736f;--teal:#087f72;--line:#dfe9e5;--paper:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#d9f2e9 0,transparent 48%),#f5f8f7;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,560px);text-align:center;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:28px;padding:clamp(28px,6vw,54px);box-shadow:0 24px 80px #173b2c0d}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.03em;margin-bottom:38px}.mark{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:var(--teal);color:#fff;font-size:21px}
.visual{width:112px;height:112px;margin:0 auto 26px;display:grid;place-items:center;border-radius:32px;background:#e7f6f0;border:1px solid #d3eee4;color:var(--teal)}
h1{font-size:clamp(30px,6vw,42px);line-height:1.1;letter-spacing:-.045em;margin:0 0 16px}p{font-size:16px;line-height:1.75;color:var(--muted);margin:0 auto;max-width:420px}
.status{display:inline-flex;align-items:center;gap:8px;margin:26px 0 0;padding:9px 13px;border:1px solid var(--line);border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#52645f}.dot{width:7px;height:7px;background:#d19a39;border-radius:50%;box-shadow:0 0 0 4px #d19a391c}
.countdown{margin:27px 0 0;padding:18px 12px 14px;background:#f2faf6;border:1px solid #dcefe6;border-radius:18px}.countdown-label{font-size:10px;font-weight:800;letter-spacing:.14em;color:#5c7770}.timer{display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,18px);margin:14px 0 8px;font-variant-numeric:tabular-nums}.timer span{display:flex;flex-direction:column;gap:4px;min-width:52px}.timer b{font-size:clamp(27px,7vw,40px);letter-spacing:-.04em;color:var(--teal)}.timer small{font-size:9px;font-weight:800;letter-spacing:.1em;color:#7c918b}.timer i{font-style:normal;font-size:26px;color:#b0c9c0;align-self:flex-start;margin-top:2px}.countdown #countdownNote{font-size:12px;margin-top:10px}.visual{animation:float 3s ease-in-out infinite}.visual svg{animation:spin 18s linear infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}footer{margin-top:34px;padding-top:22px;border-top:1px solid var(--line);font-size:12px;color:#84918d}.feedback-note{margin:20px auto 0;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}.feedback-note strong{display:block;font-size:15px;margin-bottom:6px}.feedback-note p{font-size:13px;line-height:1.6}.feedback-button,.feedback-submit{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:14px;padding:0 18px;border:0;border-radius:12px;background:var(--teal);color:#fff;font:700 14px inherit;text-decoration:none;cursor:pointer}.feedback-form{display:none;margin-top:16px;text-align:left}.feedback-form.open{display:block}.feedback-form label{display:block;margin:12px 0 6px;font-size:12px;font-weight:700;color:#405750}.feedback-form select,.feedback-form textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;color:var(--ink);background:#fff}.feedback-form textarea{min-height:100px;resize:vertical}.feedback-form .help{font-size:11px;margin-top:9px}.feedback-status{font-size:12px;margin-top:10px}.feedback-submit:disabled{opacity:.6;cursor:wait}.feedback-button:focus-visible,.feedback-submit:focus-visible{outline:3px solid #8ed7c6;outline-offset:3px}
@media(max-width:420px){body{padding:14px}main{border-radius:22px}.brand{margin-bottom:30px}}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark">N</span><span>Noida Bus Tracker</span></div>
  <div class="visual" aria-hidden="true"><svg width="60" height="60" viewBox="0 0 60 60" fill="none"><path d="M30 7v5M30 48v5M7 30h5M48 30h5M13.7 13.7l3.6 3.6m25.4 25.4 3.6 3.6m0-32.6-3.6 3.6M17.3 42.7l-3.6 3.6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="30" cy="30" r="16" stroke="currentColor" stroke-width="2.5"/><path d="M30 20v11l7 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h1>We’ll be back soon.</h1>
  <p id="message">We are making a few improvements. Please check back shortly.</p>
  <div class="countdown" aria-live="polite"><span class="countdown-label">EXPECTED RETURN IN</span><div class="timer" id="countdown"><span><b id="hours">00</b><small>HOURS</small></span><i>:</i><span><b id="minutes">00</b><small>MINUTES</small></span><i>:</i><span><b id="seconds">00</b><small>SECONDS</small></span></div><p id="countdownNote">We’ll automatically restore service when the timer ends.</p></div><div class="status"><span class="dot"></span> Temporary service pause</div>
  <footer>Thank you for your patience.<br>Noida · Greater Noida</footer>
</main>
<script>
(function(){
  var endpoint="https://noida-bus-tracker.onrender.com/api/maintenance";
  var feedbackEndpoint="https://api.web3forms.com/submit";
  var feedbackAccessKey="9f660460-b738-4ab4-88ae-2f986f049c5d";
  var endAt=null;
  var timer=document.getElementById("countdown");
  var note=document.getElementById("countdownNote");
  var statusCheckInFlight=false;
  var redirecting=false;
  function pad(n){return String(n).padStart(2,"0")}
  function returnToTracker(){
    if(redirecting)return;
    redirecting=true;
    note.textContent="Maintenance has ended. Returning you to the tracker…";
    window.location.replace("./");
  }
  function tick(){
    if(!endAt){timer.hidden=true;note.textContent="Our team is working to bring the tracker back as soon as possible.";return}
    var ms=Math.max(0,endAt-Date.now());
    var total=Math.floor(ms/1000);
    document.getElementById("hours").textContent=pad(Math.floor(total/3600));
    document.getElementById("minutes").textContent=pad(Math.floor(total%3600/60));
    document.getElementById("seconds").textContent=pad(total%60);
    if(total<=0){
      note.textContent="The scheduled maintenance window has ended. Returning to the tracker…";
      checkStatus();
      return;
    }
    note.textContent="Service is scheduled to return when this countdown reaches zero.";
  }
  function checkStatus(){
    if(statusCheckInFlight||redirecting)return;
    statusCheckInFlight=true;
    fetch(endpoint,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("status unavailable");return r.json()}).then(function(s){
      if(!s.enabled){returnToTracker();return}
      if(s.message)document.getElementById("message").textContent=s.message;
      endAt=s.expires_at||null;
      timer.hidden=!endAt;
      tick();
    }).catch(function(){note.textContent="We’re still working on it. This page will check again shortly.";}).finally(function(){statusCheckInFlight=false;});
  }
  var feedbackToggle=document.getElementById("feedbackToggle");
  var feedbackForm=document.getElementById("maintenanceFeedbackForm");
  var feedbackStatus=document.getElementById("feedbackStatus");
  var feedbackSubmit=document.getElementById("feedbackSubmit");
  feedbackToggle.addEventListener("click",function(){
    var open=feedbackForm.classList.toggle("open");
    feedbackToggle.setAttribute("aria-expanded",String(open));
    feedbackToggle.textContent=open?"Hide feedback form":"Feedback & suggestions";
    if(open)document.getElementById("feedbackRating").focus();
  });
  feedbackForm.addEventListener("submit",function(event){
    event.preventDefault();
    if(!feedbackForm.reportValidity())return;
    feedbackSubmit.disabled=true;
    feedbackStatus.textContent="Sending your feedback…";
    var payload={
      access_key:feedbackAccessKey,
      subject:"Noida Bus Tracker - Feedback (Maintenance Page)",
      from_name:"Noida Bus Tracker",
      rating:document.getElementById("feedbackRating").value,
      feedback_type:document.getElementById("feedbackType").value,
      message:document.getElementById("feedbackMessage").value.trim(),
      time:new Date().toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"})
    };
    fetch(feedbackEndpoint,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)})
      .then(function(response){return response.json().then(function(data){if(!response.ok||!data.success)throw new Error(data.message||"failed");return data;});})
      .then(function(){
        feedbackForm.reset();
        feedbackStatus.textContent="Feedback received. Thank you for helping us improve the tracker.";
        feedbackSubmit.textContent="Feedback sent";
      })
      .catch(function(){
        feedbackStatus.textContent="Could not send feedback right now. Please try again later.";
      })
      .finally(function(){feedbackSubmit.disabled=false;});
  });
  checkStatus();
  setInterval(tick,1000);
  setInterval(checkStatus,5000);
})();
</script>
</body>
</html>
