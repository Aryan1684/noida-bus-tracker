<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bus Reports · Noida Bus Tracker</title>
<link rel="icon" href="assets/noida-bus-tracker-mark.svg" type="image/svg+xml">
</head>
<body>
<form name="bus-reports" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
<input type="hidden" name="form-name" value="bus-reports">
<input name="bus_id">
<input name="report_type">
<input name="value">
<textarea name="note"></textarea>
<label>I understand this report is processed for service improvement <input type="checkbox" name="consent"></label>
<p style="position:absolute;overflow:hidden;clip:rect(0 0 0 0);height:1px;width:1px;margin:-1px;padding:0;border:0">
<label>Do not fill this out <input name="bot-field"></label>
</p>
</form>
</body>
</html>
