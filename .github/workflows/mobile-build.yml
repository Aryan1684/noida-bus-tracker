name: Android app build

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android project scaffolding
        working-directory: mobile
        run: flutter create --platforms=android --org com.noidabus .

      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Remove generated placeholder test
        working-directory: mobile
        run: rm -f test/widget_test.dart

      - name: Analyze Flutter source
        working-directory: mobile
        run: flutter analyze lib/ --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: noida-bus-tracker-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
