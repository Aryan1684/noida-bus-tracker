name: Android app build

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android project scaffolding
        working-directory: mobile
        run: flutter create --platforms=android --org com.noidabus .

      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Remove generated placeholder test
        working-directory: mobile
        run: rm -f test/widget_test.dart

      - name: Analyze Flutter source
        working-directory: mobile
        run: flutter analyze lib/ --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: noida-bus-tracker-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to stable GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          if gh release view mobile-latest >/dev/null 2>&1; then
            gh release upload mobile-latest "$APK#noida-bus-tracker.apk" --clobber
            gh release edit mobile-latest --title "Noida Bus Tracker for Android" --notes "Latest Android APK for Noida Bus Tracker. Download noida-bus-tracker.apk and install it to update the app."
          else
            gh release create mobile-latest "$APK#noida-bus-tracker.apk" --title "Noida Bus Tracker for Android" --notes "Latest Android APK for Noida Bus Tracker. Download noida-bus-tracker.apk and install it to update the app."
          fi
